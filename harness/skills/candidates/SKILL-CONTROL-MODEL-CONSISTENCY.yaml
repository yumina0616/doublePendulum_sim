id: SKILL-CONTROL-MODEL-CONSISTENCY

trigger:
  changed_files:
    - "*.urdf"
    - "*.xacro"
    - "*model_params*"

procedure:
  - detect plant parameter change
  - regenerate linear model (linear_model.py's PendulumParams)
  - recompute controller gain (lqr_controller.py design_lqr)
  - run nominal simulation
  - run regression evaluation

reason: >
  Controller matrices (LQR K, PD gains if re-tuned) depend on the plant's mass/length parameters through the linearized model. Changing the plant definition without regenerating that model leaves the controller acting on a stale, now-incorrect physical model.

