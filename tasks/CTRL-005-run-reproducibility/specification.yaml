task_id: CTRL-005
goal: >
  CTRL-003/CTRL-004 established that pd/nominal_balance shows large,
  unexplained run-to-run variance (overshoot_q1_deg observed at 200.5,
  26.8, 63.9 across identical clean runs) with root cause never isolated
  after two separate investigation attempts. Re-investigate with fresh
  eyes on the actual controller/harness code (not just infra-timing
  theories already ruled out), find and fix any real bugs, and
  re-measure variance under the fix(es).

allowed_changes:
  - double_pendulum_eval/scripts/run_clean_experiment.sh (readiness check
    for the PD controller path, mirroring the LQR path's existing check)
  - double_pendulum_eval/run_experiment.py (gate the settle/disturbance/
    total_duration schedule on real /joint_states data having arrived,
    instead of starting the clock at node construction)

forbidden_changes:
  - this specification.yaml
  - any scenario's acceptance criteria (per-run bounds stay exactly as-is)
  - double_pendulum_control/pd_controller.py, lqr_controller.py (no gain
    or control-law changes -- this task is about measurement validity,
    not control performance)

acceptance:
  - at least one concrete, code-level bug identified and fixed (not just
    another inconclusive infra-timing theory)
  - a fresh N=7+ repeated-run comparison under the fix shows measurably
    reduced variance vs CTRL-003/CTRL-004's baseline numbers
  - honestly documented either way -- if variance doesn't improve, say so

regression:
  - a single run_clean_experiment.sh invocation for both pd and lqr still
    completes and produces a real (non-infra-aborted) result.json
