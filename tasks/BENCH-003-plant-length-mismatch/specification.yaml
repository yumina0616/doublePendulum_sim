task_id: BENCH-003
goal: >
  Second, independent instance of the same failure pattern as BENCH-001
  (plant parameter changed, controller model not regenerated), using a
  different parameter (link1 length instead of link2 mass) so
  HARNESS-001's failure-store/categorization pipeline has >=2 real,
  independent pieces of evidence before proposing a skill -- matching
  project_plan.md section 11.1's own example, which uses three separate
  task instances (mass change, length change, inertia change) to justify
  one proposed skill.

allowed_changes:
  - double_pendulum_description/urdf/double_pendulum.urdf.xacro (L1: 1.0 -> 1.3)

forbidden_changes:
  - double_pendulum_control/linear_model.py (must stay at its default
    L1=1.0 -- deliberate mismatch, same as BENCH-001's intent)
  - double_pendulum_control/lqr_controller.py
  - this specification.yaml

acceptance:
  - run_repeated_experiment.sh lqr nominal_balance 3 0.6 executed against
    the mismatched plant (L1=1.3, controller model still assumes L1=1.0)
  - result recorded as a genuine pass_rate, whatever it is

regression:
  - not applicable -- reverted by HARNESS-001 immediately after data collection
